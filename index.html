<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぼくれぽーと</title>

    <!--Google Fonts（必須）-->
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

    <!--NES.css-->
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Press Start 2P', 'DotGothic16', cursive;
            padding: 20px;
            background-image: url("images/RetoroBackground3.png");
            background-size: 100% auto;
            background-repeat: repeat-y;
            background-position: top center;
            color: #000000;
        }

        .dotgothic16-regular {
            font-family: "DotGothic16", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        /* ゲーム風のタイトル */
        .title-screen {
            font-family: 'DotGothic16', sans-serif; 
            text-align: center;
            margin-bottom:40px;
        }

        /*入力フォームエリア 別提案アリ！*/
        .game-window {
            font-size: 14px;
        }

        .game-window h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .game-window label {
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        .game-window .nes-input,
        .game-window .nes-textarea {
            font-size: 15px;
        }

        .game-window .nes-select select {
            font-size: 15px;
            color: #000000;
        }

        .game-window .nes-checkbox + span {
            font-size: 12px;
        }

        .game-window .nes-btn {
            font-size: 12px;
        }

        .game-window #file-name {
            font-size: 10px;
        }

        /* アイコン選択グリッド */
        .icon-select-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px 4px;
            margin-top: -5px;
        }

        /* 各アイコンオプション */
        .icon-option {
            display: flex;
            align-items: flex-end;
            gap: 0;
            white-space: nowrap; /* ★テキストを改行させない★ */
            flex-shrink: 0; /* ★縮小を防ぐ★ */
            padding: 0px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: -5px;
        }

        .icon-option:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* アイコンとテキストのラベル部分 */
        .icon-label {
            display: flex;
            align-items: center;
            gap: 8;
            flex: 1;
        }

        /* アイコン画像 */
        .icon-preview {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        /* アイコンのテキスト */
        .icon-text {
            font-size: 14px;
            color: #fff;
        }

        /* レスポンシブ対応 */
        @media (max-width: 600px) {
            .icon-select-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); /* 自動的に列を配置 */
                gap: 5px 15px; /* ★縦方向5px、横方向15pxに変更★ */
                margin-top: 1px;
            }
        }

        /*チェックボックス・タグエリア*/
        .tags-grid {
            display: grid;
            grid-template-columns: repeat(4, 3fr);
            gap: 5px 5px;
            margin-top: 10px;
        }

        /*プレビューエリア*/
        #preview {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
        }

        .nes-container, .nes-btn, .nes-input {
            font-family: 'Press Start 2P', 'DotGothic16', cursive !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--タイトル画面-->
        <div class="title-screen">
            <div class="nes-container is-dark game-window" style="max-width: 600px; margin: 0 auto;">
                <h1 class="nes-text is primary" style="text-align: center;">ぼくれぽーと</h1>
                <p style="text-align: center; margin-top: 10px;">ぼくはれぽーとにしっかりとかきのこした！▼</p>
            </div>
        </div>

        <!--入力フォーム（ゲーム風）-->
        <div class="nes-container is-dark game-window">
            <h2 class="nes-text">じょうほうをにゅうりょくしてね▼</h2>

            <form id="movie-form">
                <!--名前の入力-->
                <div class="nes-field">
                    <label for="title">ぼくのまなえ▼</label>
                    <input type="text" id="myname" class="nes-input is-dark" placeholder="きみのなまえは？" required>
                </div>

                <div style="height: 10px;"></div> <!-- ここで高さを自由に指定 -->

                <!--ジャンル選択-->
                <div class="nes-field">
                    <label for="genre">ぶんるい▼</label>
                    <div class="nes-select">
                        <select id="genre" required>
                            <option value="">せんたくしてね！</option>
                            <option value="anime">あにめ</option>
                            <option value="comic">まんが</option>
                            <option value="movie">えいが</option>
                            <option value="game">げえむ</option>
                            <option value="novel">しょうせつ</option>
                            <option value="stage">ぶたい</option>
                        </select>
                    </div>
                </div>

                <!--タイトル入力-->
                <div class="nes-field">
                    <label for="title">さくひんのまなえ▼</label>
                    <input type="text" id="title" class="nes-input is-dark" placeholder="例：ショーシャンクの空に" required>
                </div>

                <div style="height: 10px;"></div> <!-- ここで高さを自由に指定 -->

                <!--作品の画像-->
                <div class="nes-field">
                    <label for="image-upload">さくひんのがぞう▼</label>
                    <input type="file" id="image-upload" accept="image/*" style="display: none;">
                    <button type="button" class="nes-btn" id="upload-btn">
                        がぞうをえらぶ
                    </button>
                    <p id="file-name" style="font-size: 12px; color: #aaa; margin-top: 5px;">
                        てんぷれーとがぞうをしようちゅう！
                        ※画像はご自身で権利を有するもの、または利用許可のあるものをご使用ください。
                    </p>
                </div>

                <!--あらすじ-->
                <div class="nes-field">
                    <label for="synopsis">あらすじ▼</label>
                    <textarea id="synopsis" class="nes-textarea is-dark" rows="4" placeholder="ものがたりをおしえてね！"></textarea>
                </div>

                <div style="height: 10px;"></div> <!-- ここで高さを自由に指定 -->
                
                <!--推しポイント-->
                <div class="nes-field">
                    <label for="recommend">ぼくのれぽーと▼</label>
                    <textarea id="recommend" class="nes-textarea is-dark" rows="4" placeholder="あなたのすきはどんなところ？"></textarea>
                </div>

                <div style="height: 10px;"></div> <!-- ここで高さを自由に指定 -->

                <!--タグ選択（チェックボックス）-->
                <div class="nes-field">
                    <label>じゃんるをえらぶ▼</label>
                    <div class="tags-grid">
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="かんどう">
                            <span>かんどう</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ばくしょう">
                            <span>ばくしょう</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="せいしゅん">
                            <span>せいしゅん</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ねっけつ">
                            <span>ねっけつ</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="あくしょん">
                            <span>あくしょん</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="れんあい">
                            <span>れんあい</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ぼうけん">
                            <span>ぼうけん</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="どきゅめんたりー">
                            <span>どきゅめんたりー</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="どうぶつ">
                            <span>どうぶつ</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ほらー">
                            <span>ほらー</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ひとこわ">
                            <span>ひとこわ</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="れきし">
                            <span>れきし</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="せんそう">
                            <span>せんそう</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ひゅーまん">
                            <span>ひゅーまん</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ふぁんたじー">
                            <span>ふぁんたじー</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="のんふぃくしょん">
                            <span>のんふぃくしょん</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="みゅーじかる">
                            <span>みゅーじかる</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="みすてりー">
                            <span>みすてりー</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="えすえふ">
                            <span>えすえふ</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="ぐるめ">
                            <span>ぐるめ</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="めいさく">
                            <span>めいさく</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="しょうじょまんが">
                            <span>しょうじょまんが</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="しょうねんまんが">
                            <span>しょうねんまんが</span>
                        </label>
                        <label>
                            <input type="checkbox" class="nes-checkbox is-dark" value="どうぶつがしなない">
                            <span>どうぶつがしなない</span>
                        </label>
                    </div>
                </div>

                <!--背景選択-->
                <div class="nes-field">
                    <label for="background">はいけいをえらぶ▼</label>
                    <div class="nes-select">
                        <select id="background" required>
                            <option value="">せんたくしてね！</option>
                            <option value="custom">じぶんのよういしたがぞう</option>
                            <option value="black">くろ</option>
                            <option value="red">あか</option>
                            <option value="blue">あお</option>
                            <option value="yellow">きいろ</option>
                            <option value="green">みどり</option>
                            <option value="orangi">おれんじ</option>
                            <option value="purple">むらさき</option>
                            <option value="brown">ちゃいろ</option>
                            <option value="pink">ももいろ</option>
                            <option value="gray">はいいろ</option>
                        </select>
                    </div>
                </div>
                
                <!--カスタム背景画像アップロード-->
                <div class="nes-field" id="custom-background-field" style="display: none;">
                    <label for="custom-background">はいけいのがぞう▼</label>
                    <input type="file" id="custom-background" accept="image/*">
                </div>

                <div style="height: 5px;"></div> <!-- ここで高さを自由に指定 -->

                <p style="font-size: 14px; color: #ffffff; margin-top: 0px; margin-bottom: 1px;">
                    はいけいのちょうせい▼
                </p>
                <!-- スライダーを横並びに配置するための親要素 -->
                <div style="display: flex; gap: 30px; align-items: flex-start; margin-top: 2px; margin-bottom: 1px;">
                    <!--背景再度調整-->
                    <div class="ness-field">
                        <label for="saturation-slider" style="font-size: 12px; margin-bottom: 1px;">さいどのちょうせい</label>
                        <input type="range" id="saturation-slider" min="0" max="200" value="100" step="10" style="width: 200px;">
                        <p style="font-size: 12px; color: #aaa; margin-top: 1px;">
                            　◀くすみ　　　　　 くっきり▶
                        </p>
                    </div>

                    <!-- 透過度調整スライダー(新規追加) -->
                    <div class="nes-field">
                        <label for="opacity-slider" style="font-size: 12px; margin-bottom: 1px;">とうかのちょうせい</label>
                        <input type="range" id="opacity-slider" min="0" max="200" value="100" step="10" style="width: 200px;">
                        <p style="font-size: 12px; color: #aaa; margin-top: 1px;">
                            　◀うすい　　　　　　　　こい▶
                        </p>
                    </div>
                </div>

                <!--アイコン選択(NES.cssのラジオボタン使用)-->
                <div class="nes-field">
                    <!-- ①ラベルと注釈を横並びにする -->
                    <div style="display: flex; align-items: baseline; gap: 3px; margin-bottom: 10px;">
                        <label style="margin: 0;">たいとるにひょうじするあいこん▼</label>
                        <p style="font-size: 12px; color: #aaa; margin: 0;">※１つだけえらんでね！</p>
                    </div>

                    <div class="icon-select-grid">
                        <!-- ②「ひょうじしないよ!」を初期設定(checked属性を付ける) -->
                        <label class="icon-option"  style="margin-bottom: -10px;  padding-left: 10px;">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="none" checked>
                            <span class="icon-label"  style="font-size: 12px; color: #ffffff; margin-top: -7px; margin-bottom: 0px;  padding-left: 10px;">なし</span>
                        </label>

                        <!-- ③ここで改行を入れる(親要素横幅いっぱいを指定し、改行) -->
                        <div style="grid-column: 1 / -1;"></div>

                        <label class="icon-option" style="padding-left: 10px;">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="anime">
                            <span class="icon-label">
                                <img src="icon/anime-icon.png" alt="anime" class="icon-preview">
                            </span>
                        </label>
                            
                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="comic">
                            <span class="icon-label">
                                <img src="icon/comic-icon.png" alt="comic" class="icon-preview">
                            </span>
                        </label>
        
                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="cinema">
                            <span class="icon-label">
                                <img src="icon/cinema-icon.png" alt="cinema" class="icon-preview">
                            </span>
                        </label>
        
                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="game">
                            <span class="icon-label">
                                <img src="icon/game-icon.png" alt="game" class="icon-preview">
                            </span>
                        </label>
        
                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="novel">
                            <span class="icon-label">
                                <img src="icon/novel-icon.png" alt="novel" class="icon-preview">
                            </span>
                        </label>
        
                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="stage">
                            <span class="icon-label">
                                <img src="icon/stage-icon.png" alt="stage" class="icon-preview">
                            </span>
                        </label>

                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="soda">
                            <span class="icon-label">
                                <img src="icon/soda-icon.png" alt="soda" class="icon-preview">
                            </span>
                        </label>

                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="ribon">
                            <span class="icon-label">
                                <img src="icon/ribon-icon.png" alt="ribon" class="icon-preview">
                            </span>
                        </label>                        

                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="star">
                            <span class="icon-label">
                                <img src="icon/star-icon.png" alt="star" class="icon-preview">
                            </span>
                        </label>

                        <label class="icon-option">
                            <input type="radio" class="nes-radio is-dark" name="title-icon" value="mouse">
                            <span class="icon-label">
                                <img src="icon/mouse-icon.png" alt="mouse" class="icon-preview">
                            </span>
                        </label>                            
                    </div>
                </div>
            </form>
        </div>

        <br><!--改行<br>-->

        <!--プレビューエリア-->
        <div class="nes-container" style="background: rgba(255, 255, 255, 0.5);">
            <h3>こんなかんじ！▼</h3>
            <div id="preview">
                <!--ここに生成される画像のプレビュー-->
                <p class="nes-text is-disabled" style="color: #7e7e7e;">ここにぷれいびゅーがひょうじされるよ！▼</p>
            </div>
        </div>

        <!--アクションボタン-->
        <div style="text-align: center; margin-top: 20px;">
            <button type="button" class="nes-btn is-primary" id="generate-btn">れぽーとにかきのこす</button>
            <button type="button" class="nes-btn is-success" id="download-btn" style="display: none;">だうんろーど</button>
            <button type="button" class="nes-btn is-primary" id="share-x-btn" style="display: none;">えっくすでぽすとする</button>
        </div>
    </div>
    
    <!--html 2canvas-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
